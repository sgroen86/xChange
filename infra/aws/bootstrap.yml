AWSTemplateFormatVersion: '2010-09-09'
Description: >
  xChange bootstrap. Creates the trust that lets GitHub Actions deploy into this
  account, plus the bucket that holds deployment artefacts.

  This is the one stack that cannot be created by CI, because it is what gives
  CI its permissions in the first place. Deploy it once by hand; everything
  after it is automated.

  Deliberately separate from the service stack so that CI never needs IAM write
  permissions - it can create services, but not grant itself anything.

Parameters:
  GitHubOwner:
    Type: String
    Default: sgroen86
    Description: GitHub account that owns the repository.

  GitHubRepositoryName:
    Type: String
    Default: xChange
    Description: Repository name on its own, without the owner.

  GitHubBranch:
    Type: String
    Default: main
    Description: >
      Only this branch may assume the role. Pull requests, including from forks,
      cannot - which is what stops an untrusted PR from deploying.

  GitHubEnvironment:
    Type: String
    Default: xchange-aws
    Description: >
      GitHub environment the deploy job runs in. This matters more than it
      looks: when a job declares an environment, GitHub swaps the OIDC token's
      subject claim from the branch form to the environment form, so the trust
      policy has to accept it or every run fails with
      "Not authorized to perform sts:AssumeRoleWithWebIdentity".

  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >
      Set to false if this account already trusts token.actions.githubusercontent.com
      (an account can only have one provider per URL).

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    # The provider is account-wide and shared: other stacks and other repos may
    # depend on it. Retain it so that flipping CreateOidcProvider to false, or
    # deleting this stack, cannot take it out from under them. Deleting it
    # leaves every role that trusts it failing with "The web identity token
    # provided could not be validated", which reads nothing like the real cause.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS now verifies GitHub's certificate chain against its own trust store,
      # but the field is still required by the API.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: xchange-github-deploy
      Description: Assumed by GitHub Actions to deploy the xChange API.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Four accepted subjects, because GitHub varies the claim on two
              # independent axes and a mismatch on either fails the same way:
              #
              #  1. Environment vs branch. Declaring `environment:` on a job
              #     swaps the subject to the environment form.
              #  2. Plain vs immutable identifiers. GitHub may append numeric
              #     ids to the owner and repository - this account emits
              #     repo:sgroen86@261750674/xChange@1360828142:... - so the
              #     literal owner/repo form never matches.
              #
              # StringLike is needed for the "@<id>" wildcards. It stays safe
              # because a GitHub username cannot contain "@", so "owner@*"
              # cannot be spoofed by registering a similarly-named account.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}/${GitHubRepositoryName}:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubOwner}/${GitHubRepositoryName}:ref:refs/heads/${GitHubBranch}
                  - !Sub repo:${GitHubOwner}@*/${GitHubRepositoryName}@*:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubOwner}@*/${GitHubRepositoryName}@*:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: xchange-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageTheServiceStackOnly
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  # Needed by the workflow's own recovery path: a stack whose
                  # first create failed sits in ROLLBACK_COMPLETE and can only
                  # be replaced, never updated.
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplateSummary
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListStacks
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/xchange-*/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/xchange-*

              - Sid: ReadBootstrapOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: '*'

              - Sid: Lambda
                Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:CreateFunctionUrlConfig
                  - lambda:DeleteFunction
                  - lambda:DeleteFunctionUrlConfig
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionUrlConfig
                  - lambda:ListTags
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:UpdateFunctionUrlConfig
                  # The validator is published as a version behind an alias,
                  # which SnapStart requires.
                  - lambda:PublishVersion
                  - lambda:ListVersionsByFunction
                  - lambda:CreateAlias
                  - lambda:GetAlias
                  - lambda:UpdateAlias
                  - lambda:DeleteAlias
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:xchange-*

              # The worker is triggered by the import queue. Event source
              # mappings have generated ids, so they cannot be named up front.
              - Sid: WorkerTrigger
                Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:ListEventSourceMappings
                Resource: '*'

              # Email import: the inbox domain's identity and the receipt rules
              # that hand its mail to the mail function. SES receipt rules have
              # no resource-level permissions.
              - Sid: InboxMail
                Effect: Allow
                Action:
                  - ses:CreateReceiptRuleSet
                  - ses:DeleteReceiptRuleSet
                  - ses:DescribeReceiptRuleSet
                  - ses:CreateReceiptRule
                  - ses:DeleteReceiptRule
                  - ses:UpdateReceiptRule
                  - ses:DescribeReceiptRule
                  - ses:SetActiveReceiptRuleSet
                  - ses:DescribeActiveReceiptRuleSet
                  - ses:CreateEmailIdentity
                  - ses:DeleteEmailIdentity
                  - ses:GetEmailIdentity
                  - ses:PutEmailIdentityDkimAttributes
                  - ses:PutEmailIdentityDkimSigningAttributes
                  - ses:PutEmailIdentityFeedbackAttributes
                  - ses:PutEmailIdentityMailFromAttributes
                  - ses:PutEmailIdentityConfigurationSetAttributes
                  - ses:TagResource
                  - ses:UntagResource
                  - ses:ListTagsForResource
                Resource: '*'

              # The public website (infra/aws/site.yml): CloudFront in front
              # of a private bucket. CloudFront resources are global, with
              # generated ids, so they cannot be named up front.
              - Sid: WebsiteDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:DeleteDistribution
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:ListOriginAccessControls
                  - cloudfront:CreateFunction
                  - cloudfront:UpdateFunction
                  - cloudfront:DescribeFunction
                  - cloudfront:GetFunction
                  - cloudfront:PublishFunction
                  - cloudfront:DeleteFunction
                  - cloudfront:CreateResponseHeadersPolicy
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:UpdateResponseHeadersPolicy
                  - cloudfront:DeleteResponseHeadersPolicy
                  - cloudfront:ListResponseHeadersPolicies
                  - cloudfront:GetCachePolicy
                  - cloudfront:ListCachePolicies
                Resource: '*'

              - Sid: WebsiteBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:aws:s3:::xchange-site-${AWS::AccountId}
                  - !Sub arn:aws:s3:::xchange-site-${AWS::AccountId}/*
                  # The app on app.xchangeinvoice.com (infra/aws/app.yml).
                  - !Sub arn:aws:s3:::xchange-app-${AWS::AccountId}
                  - !Sub arn:aws:s3:::xchange-app-${AWS::AccountId}/*

              # A distribution on xchangeinvoice.com names its certificate; CloudFront
              # checks the caller may see it. Read-only.
              - Sid: DistributionCertificate
                Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                Resource: '*'

              # The website's preview password - and only that secret's value.
              - Sid: WebsitePreviewPassword
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:xchange/site-preview-*

              - Sid: ImportQueues
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:SetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:TagQueue
                  - sqs:UntagQueue
                  - sqs:ListQueueTags
                Resource: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:xchange-*

              - Sid: IdentityTable
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:UpdateTable
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:TagResource
                  - dynamodb:ListTagsOfResource
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:UpdateContinuousBackups
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/xchange-*

              - Sid: DocumentBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketTagging
                  - s3:GetEncryptionConfiguration
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketTagging
                  - s3:PutEncryptionConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:PutLifecycleConfiguration
                Resource:
                  - !Sub arn:aws:s3:::xchange-documents-${AWS::AccountId}
                  # Received mail, kept 30 days.
                  - !Sub arn:aws:s3:::xchange-mail-${AWS::AccountId}

              - Sid: LogGroupForTheFunction
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:ListTagsForResource
                Resource: '*'

              # The service stack creates the functions' own execution roles, so
              # CI needs to manage and pass those roles - and only those.
              - Sid: ManageTheFunctionRole
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:PassRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/xchange-api-lambda
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/xchange-validator-lambda
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/xchange-worker-lambda
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/xchange-mail-lambda

              - Sid: UploadDeploymentArtifacts
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*

              # Create the secret if it is missing and read its metadata, but
              # never read or overwrite the value. The Anthropic key is set once
              # by a human and CI has no reason to see it.
              - Sid: SecretMetadataOnly
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DescribeSecret
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:xchange/*

  ArtifactBucket:
    Type: AWS::S3::Bucket
    # Holds deployment zips. Retained so a stack delete cannot silently discard
    # the artefact the running function is still pointing at.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub xchange-artifacts-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # Old build artefacts are worthless and S3 storage is one of the few
          # things that would otherwise slowly accrue cost.
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 30

Outputs:
  GitHubDeployRoleArn:
    Description: Put this in the GitHub environment as AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GitHubDeployRole.Arn
    Export:
      Name: xchange-github-deploy-role-arn

  ArtifactBucketName:
    Description: Read by the deploy workflow; no need to copy it anywhere.
    Value: !Ref ArtifactBucket
    Export:
      Name: xchange-artifact-bucket
