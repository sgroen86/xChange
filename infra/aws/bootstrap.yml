AWSTemplateFormatVersion: '2010-09-09'
Description: >
  xChange bootstrap. Creates the trust that lets GitHub Actions deploy into this
  account, plus the role App Runner uses to pull images from ECR.

  This is the one stack that cannot be created by CI, because it is what gives
  CI its permissions in the first place. Deploy it once by hand; everything
  after it is automated.

  Deliberately separate from the service stack so that CI never needs IAM write
  permissions - it can create services, but not grant itself anything.

Parameters:
  GitHubOwner:
    Type: String
    Default: sgroen86
    Description: GitHub account that owns the repository.

  GitHubRepositoryName:
    Type: String
    Default: xChange
    Description: Repository name on its own, without the owner.

  GitHubBranch:
    Type: String
    Default: main
    Description: >
      Only this branch may assume the role. Pull requests, including from forks,
      cannot - which is what stops an untrusted PR from deploying.

  GitHubEnvironment:
    Type: String
    Default: xchange-aws
    Description: >
      GitHub environment the deploy job runs in. This matters more than it
      looks: when a job declares an environment, GitHub swaps the OIDC token's
      subject claim from the branch form to the environment form, so the trust
      policy has to accept it or every run fails with
      "Not authorized to perform sts:AssumeRoleWithWebIdentity".

  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >
      Set to false if this account already trusts token.actions.githubusercontent.com
      (an account can only have one provider per URL).

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    # The provider is account-wide and shared: other stacks and other repos may
    # depend on it. Retain it so that flipping CreateOidcProvider to false, or
    # deleting this stack, cannot take it out from under them. Deleting it
    # leaves every role that trusts it failing with "The web identity token
    # provided could not be validated", which reads nothing like the real cause.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS now verifies GitHub's certificate chain against its own trust store,
      # but the field is still required by the API.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: xchange-github-deploy
      Description: Assumed by GitHub Actions to deploy the xChange API.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Four accepted subjects, because GitHub varies the claim on two
              # independent axes and a mismatch on either fails the same way:
              #
              #  1. Environment vs branch. Declaring `environment:` on a job
              #     swaps the subject to the environment form.
              #  2. Plain vs immutable identifiers. GitHub may append numeric
              #     ids to the owner and repository - this account emits
              #     repo:sgroen86@261750674/xChange@1360828142:... - so the
              #     literal owner/repo form never matches.
              #
              # StringLike is needed for the "@<id>" wildcards. It stays safe
              # because a GitHub username cannot contain "@", so "owner@*"
              # cannot be spoofed by registering a similarly-named account.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}/${GitHubRepositoryName}:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubOwner}/${GitHubRepositoryName}:ref:refs/heads/${GitHubBranch}
                  - !Sub repo:${GitHubOwner}@*/${GitHubRepositoryName}@*:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubOwner}@*/${GitHubRepositoryName}@*:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: xchange-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'

              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:CreateRepository
                  - ecr:DescribeRepositories
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:PutImageScanningConfiguration
                  - ecr:UploadLayerPart
                Resource: '*'

              - Sid: ManageTheServiceStackOnly
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplateSummary
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListStacks
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/xchange-*/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/xchange-*

              - Sid: ReadBootstrapOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: '*'

              - Sid: AppRunner
                Effect: Allow
                Action:
                  - apprunner:CreateService
                  - apprunner:DeleteService
                  - apprunner:DescribeService
                  - apprunner:ListServices
                  - apprunner:ListTagsForResource
                  - apprunner:StartDeployment
                  - apprunner:TagResource
                  - apprunner:UpdateService
                Resource: '*'

              # Create the secret if it is missing and read its metadata, but
              # never read or overwrite the value. The Anthropic key is set once
              # by a human and CI has no reason to see it.
              - Sid: SecretMetadataOnly
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DescribeSecret
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:xchange/*

              # Hand the pull role to App Runner without being able to modify it.
              - Sid: PassTheEcrAccessRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt AppRunnerEcrAccessRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: build.apprunner.amazonaws.com

  AppRunnerEcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: xchange-apprunner-ecr-access
      Description: Lets App Runner pull the xChange API image from ECR.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  # The instance role is what the running container uses. It needs to read the
  # Anthropic key, and nothing else.
  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: xchange-apprunner-instance
      Description: Runtime role for the xChange API container.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-anthropic-key
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:xchange/anthropic-api-key-*

Outputs:
  GitHubDeployRoleArn:
    Description: Put this in the GitHub environment as AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GitHubDeployRole.Arn
    Export:
      Name: xchange-github-deploy-role-arn

  AppRunnerEcrAccessRoleArn:
    Description: Read by the deploy workflow; no need to copy it anywhere.
    Value: !GetAtt AppRunnerEcrAccessRole.Arn
    Export:
      Name: xchange-apprunner-ecr-access-role-arn

  AppRunnerInstanceRoleArn:
    Description: Read by the deploy workflow; no need to copy it anywhere.
    Value: !GetAtt AppRunnerInstanceRole.Arn
    Export:
      Name: xchange-apprunner-instance-role-arn
