AWSTemplateFormatVersion: '2010-09-09'
Description: >
  xChange API on Lambda behind a Function URL.

  Chosen because it is free at this stage: Lambda's 1M requests and 400,000
  GB-seconds per month are a perpetual free tier, a Function URL costs nothing
  and terminates TLS itself, and nothing runs between uploads. The alternative
  that preserves 20 MB uploads - Fargate behind an Application Load Balancer -
  bills around $25-35 a month whether or not anyone uses it.

  The trade-off is request size: a Function URL rejects anything over 6 MB, and
  a binary body is base64-encoded first, so roughly 4.4 MB of PDF gets through.
  The API refuses larger files with a clear message. Restoring 20 MB means
  uploading straight to object storage with a presigned URL and passing the key
  to the endpoint, which is the architecture CLAUDE.md already describes.

Parameters:
  ArtifactBucket:
    Type: String
    Description: Bucket holding the deployment zip. From the bootstrap stack.

  ArtifactKey:
    Type: String
    Description: Key of the zip for this commit.

  AnthropicSecretArn:
    Type: String
    Description: Secrets Manager ARN holding the Anthropic API key.

  ValidatorArtifactKey:
    Type: String
    Description: Key of the official-rules validator zip (validator/build.sh) for this commit.

  WorkerArtifactKey:
    Type: String
    Description: Key of the background worker zip (src/InvoicePlatform.Worker) for this commit.

  InboxDomain:
    Type: String
    Default: inbox.xchangeinvoice.com
    Description: >
      The subdomain organisations' invoice inboxes live on. Its MX record points
      at inbound-smtp.eu-central-1.amazonaws.com, and the DKIM records from
      this stack's outputs verify it - both set by hand at the DNS host.

  AnthropicModel:
    Type: String
    Default: claude-opus-5

  AllowedOrigin:
    Type: String
    Default: https://greenitsolutions.net

  AllowedOriginWww:
    Type: String
    Default: https://www.greenitsolutions.net

  # The app's own domain (from 2026-10-18). Its bare form redirects to www, but
  # both are allowed so a stray bare URL still works.
  AppOrigin:
    Type: String
    Default: https://www.xchangeinvoice.com

  AppOriginBare:
    Type: String
    Default: https://xchangeinvoice.com

  MemorySize:
    Type: Number
    Default: 1024
    Description: >
      More memory also means proportionally more CPU, which shortens the cold
      start. 1024 MB keeps a request comfortably inside the free tier: the
      monthly 400,000 GB-seconds is about 6.5 hours of execution at this size.

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: xchange-api-lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-anthropic-key
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The one privilege the function has beyond writing its own logs.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AnthropicSecretArn

        - PolicyName: identity-table
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  # Listing organisations and counting their users.
                  - dynamodb:Query
                Resource: !GetAtt IdentityTable.Arn

        - PolicyName: official-validator
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Only the published alias, never $LATEST: the alias is the
              # SnapStart-enabled version.
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref ValidatorAlias

        - PolicyName: invoice-storage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  # Booking takes the upload's extraction (read and delete in one call),
                  # and a reviewer can make xChange forget a correction.
                  - dynamodb:DeleteItem
                Resource: !GetAtt InvoiceTable.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${DocumentBucket.Arn}/*
              # Batch import: the API stores the PDF and queues it; the worker reads it.
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ImportQueue.Arn

  # Users, sessions and login-attempt counters.
  #
  # DynamoDB rather than the PostgreSQL CLAUDE.md specifies, and knowingly so:
  # 25 GB and 25 read/write units a month are a perpetual free tier where the
  # smallest RDS instance is not free, and a Lambda has no connection pool to
  # keep warm. On-demand billing means an idle app costs nothing. Move to
  # PostgreSQL when the database lands - the store interfaces exist so the swap
  # touches one class.
  IdentityTable:
    Type: AWS::DynamoDB::Table
    # User accounts are not build output. Losing this table means everyone is
    # locked out and setup has to be redone.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: xchange-identity
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        # Expired sessions and stale lockout counters delete themselves.
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: Project
          Value: xchange

  # Booked invoices. Same reasoning as the identity table: DynamoDB is free at
  # this volume where RDS is not, and the store interfaces make a later move to
  # PostgreSQL a one-class change.
  InvoiceTable:
    Type: AWS::DynamoDB::Table
    # Booked invoices are the user's own records, not build output.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: xchange-invoices
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        # What the model read for an upload is kept 30 days, for learning
        # from the reviewer's corrections; invoices themselves never expire.
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: xchange

  # Source PDFs. Private and encrypted; re-booking an invoice overwrites its own
  # document rather than accumulating copies.
  DocumentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub xchange-documents-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: xchange

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: xchange-api
      Runtime: dotnet8
      # ASP.NET Core hosted by Amazon.Lambda.AspNetCoreServer.Hosting: the
      # handler is just the assembly name.
      Handler: InvoicePlatform.Api
      Role: !GetAtt FunctionRole.Arn
      MemorySize: !Ref MemorySize
      # Longer than the interpreter's own 180s timeout, so the app reports a
      # provider timeout itself rather than being killed mid-request.
      Timeout: 300
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          ASPNETCORE_ENVIRONMENT: Production
          # Double underscore is how .NET maps env vars onto nested config keys.
          Anthropic__Model: !Ref AnthropicModel
          Anthropic__ApiKeySecretArn: !Ref AnthropicSecretArn
          Identity__TableName: !Ref IdentityTable
          InvoiceStorage__TableName: !Ref InvoiceTable
          InvoiceStorage__BucketName: !Ref DocumentBucket
          Cors__AllowedOrigins__0: !Ref AllowedOrigin
          Cors__AllowedOrigins__1: !Ref AllowedOriginWww
          Cors__AllowedOrigins__2: !Ref AppOrigin
          Cors__AllowedOrigins__3: !Ref AppOriginBare
          OfficialValidation__FunctionName: !Ref ValidatorAlias
          Imports__QueueUrl: !Ref ImportQueue
          Inbox__Domain: !Ref InboxDomain
      Tags:
        - Key: Project
          Value: xchange

  # Log retention is not just tidiness: the default is "never expire", and
  # CloudWatch storage is one of the few things here that would eventually cost
  # money on its own.
  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Function}
      RetentionInDays: 14

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      # No authentication. Anyone with the URL can post a PDF and spend
      # Anthropic credit - acceptable while this is a testing prototype, and
      # called out in docs/aws-deployment.md. Add auth before real use.
      AuthType: NONE
      # No Cors block, deliberately: the app is the only CORS layer
      # (Program.cs). With CORS set here as well, Lambda added its own
      # Access-Control-Allow-Origin next to the app's, and browsers reject a
      # response with two - every call from the site failed. The app answers
      # preflights itself, allows the methods the site uses (PUT included)
      # and exposes Content-Disposition and X-Validation-Warnings; that is
      # covered by RouteProtectionTests.

  # Since October 2025 a function URL needs BOTH lambda:InvokeFunctionUrl and
  # lambda:InvokeFunction; with only the first, every request returns 403 even
  # when AuthType is NONE and the policy looks correct.
  #
  # Only the first can be declared here. The second must carry the
  # InvokedViaFunctionUrl condition - which keeps the anonymous grant to calls
  # arriving through the URL, rather than to the Lambda API at large - and
  # AWS::Lambda::Permission has no property for that condition. Declaring it
  # with FunctionUrlAuthType instead is rejected outright:
  # "FunctionUrlAuthType is only supported for lambda:InvokeFunctionUrl action".
  #
  # The deploy workflow adds it with the CLI, idempotently, straight after this
  # stack settles.
  UrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt Function.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  # ── Official-rules validator ──────────────────────────────────────────────
  #
  # The complete official rules are XSLT 2.0, which .NET cannot run, so they
  # run here: Java 21 and Saxon-HE (validator/). The API invokes the "live"
  # alias after writing each file and before handing it out.
  #
  # SnapStart snapshots the function after its initialiser has compiled the
  # rules, so a cold start restores them instead of compiling for seconds. It
  # applies to published versions only: each deploy publishes one (the
  # artefact key in the description changes per commit, which replaces the
  # version) and moves the alias to it.
  ValidatorRole:
    Type: AWS::IAM::Role
    Properties:
      # Named, because the deploy role may only manage roles it knows by name
      # (infra/aws/bootstrap.yml).
      RoleName: xchange-validator-lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # Nothing beyond its own logs: it reads no data and calls nothing.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Project
          Value: xchange

  ValidatorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: xchange-validator
      Runtime: java21
      Handler: xchange.validator.Handler::handleRequest
      Role: !GetAtt ValidatorRole.Arn
      # Compiling the rules is CPU-bound; more memory is more CPU.
      MemorySize: 1024
      Timeout: 60
      SnapStart:
        ApplyOn: PublishedVersions
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ValidatorArtifactKey
      Tags:
        - Key: Project
          Value: xchange

  ValidatorLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ValidatorFunction}
      RetentionInDays: 14

  ValidatorVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref ValidatorFunction
      Description: !Ref ValidatorArtifactKey

  ValidatorAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref ValidatorFunction
      FunctionVersion: !GetAtt ValidatorVersion.Version
      Name: live

  # Batch and email import. The API stores each PDF and puts its id on this
  # queue; the worker reads it in the background, with the same extraction as
  # a single upload. The visibility timeout is six times the worker's own, as
  # AWS advises for Lambda consumers.
  ImportQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: xchange-imports
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ImportDeadLetters.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: xchange

  # Messages the worker failed three times for a reason other than the
  # document (storage, network). A document the model cannot read is marked
  # failed on the import instead, and is never retried by itself.
  ImportDeadLetters:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: xchange-imports-failed
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: xchange

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      # Named, because the deploy role may only manage roles it knows by name.
      RoleName: xchange-worker-lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: worker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AnthropicSecretArn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ImportQueue.Arn
              # Imports, learning and relations live in the invoice table.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:DeleteItem
                Resource: !GetAtt InvoiceTable.Arn
              # The organisation's settings fill the seller's electronic address.
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt IdentityTable.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${DocumentBucket.Arn}/*
      Tags:
        - Key: Project
          Value: xchange

  Worker:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: xchange-worker
      Runtime: dotnet8
      Handler: InvoicePlatform.Worker::InvoicePlatform.Worker.ImportFunction::HandleAsync
      Role: !GetAtt WorkerRole.Arn
      MemorySize: !Ref MemorySize
      # As the API: longer than the interpreter's own timeout.
      Timeout: 300
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref WorkerArtifactKey
      Environment:
        Variables:
          Anthropic__Model: !Ref AnthropicModel
          Anthropic__ApiKeySecretArn: !Ref AnthropicSecretArn
          Identity__TableName: !Ref IdentityTable
          InvoiceStorage__TableName: !Ref InvoiceTable
          InvoiceStorage__BucketName: !Ref DocumentBucket
          Imports__QueueUrl: !Ref ImportQueue
      Tags:
        - Key: Project
          Value: xchange

  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Worker}
      RetentionInDays: 14

  # One PDF per invocation, and at most two at a time: Anthropic's rate
  # limits, not Lambda, are the bottleneck, and a batch of fifty should queue
  # rather than all fail at once.
  WorkerTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ImportQueue.Arn
      FunctionName: !Ref Worker
      BatchSize: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures
      ScalingConfig:
        MaximumConcurrency: 2

  # ---------------------------------------------------------------------------
  # Email import. SES receives mail for the inbox domain, stores it in the mail
  # bucket and calls the mail function, which turns every PDF attachment into
  # an import for the organisation the address belongs to.
  # ---------------------------------------------------------------------------

  # Raw mail is kept only as long as it takes to read it.
  MailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub xchange-mail-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: delete-received-mail
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: xchange

  MailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${MailBucket.Arn}/inbound/*
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  # The domain SES receives for. Verified by the DKIM records in the outputs.
  InboxIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref InboxDomain

  MailFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: xchange-mail-lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: mail
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${MailBucket.Arn}/inbound/*
              # Which organisation an inbox address belongs to.
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt IdentityTable.Arn
              # The import record and its PDF, then the queue.
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt InvoiceTable.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${DocumentBucket.Arn}/*
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ImportQueue.Arn
      Tags:
        - Key: Project
          Value: xchange

  MailFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: xchange-mail
      Runtime: dotnet8
      # The same package as the worker: one assembly, two handlers.
      Handler: InvoicePlatform.Worker::InvoicePlatform.Worker.MailFunction::HandleAsync
      Role: !GetAtt MailFunctionRole.Arn
      MemorySize: 512
      Timeout: 120
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref WorkerArtifactKey
      Environment:
        Variables:
          Identity__TableName: !Ref IdentityTable
          InvoiceStorage__TableName: !Ref InvoiceTable
          InvoiceStorage__BucketName: !Ref DocumentBucket
          Imports__QueueUrl: !Ref ImportQueue
          Inbox__Domain: !Ref InboxDomain
          Inbox__MailBucketName: !Ref MailBucket
      Tags:
        - Key: Project
          Value: xchange

  MailFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${MailFunction}
      RetentionInDays: 14

  MailInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MailFunction
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # A rule set is only used once it is the active one; the deploy workflow
  # activates it (CloudFormation cannot).
  InboxRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Properties:
      RuleSetName: xchange-inbox

  InboxRule:
    Type: AWS::SES::ReceiptRule
    DependsOn:
      - MailBucketPolicy
      - MailInvokePermission
    Properties:
      RuleSetName: !Ref InboxRuleSet
      Rule:
        Name: xchange-inbox-pdfs
        Enabled: true
        Recipients:
          - !Ref InboxDomain
        # Spam and virus verdicts reach the mail function, which drops a FAIL.
        ScanEnabled: true
        TlsPolicy: Optional
        Actions:
          - S3Action:
              BucketName: !Ref MailBucket
              ObjectKeyPrefix: inbound/
          - LambdaAction:
              FunctionArn: !GetAtt MailFunction.Arn
              InvocationType: Event

Outputs:
  ServiceUrl:
    Description: >
      Public HTTPS endpoint. Set this as the XCHANGE_API_URL repository variable
      so the frontend build points at it. Note the trailing slash is stripped by
      the client.
    Value: !GetAtt FunctionUrl.FunctionUrl

  FunctionName:
    Value: !Ref Function

  # The three CNAME records that verify the inbox domain for SES, to be set at
  # the DNS host together with the MX record.
  InboxDkim1:
    Value: !Sub "${InboxIdentity.DkimDNSTokenName1} CNAME ${InboxIdentity.DkimDNSTokenValue1}"
  InboxDkim2:
    Value: !Sub "${InboxIdentity.DkimDNSTokenName2} CNAME ${InboxIdentity.DkimDNSTokenValue2}"
  InboxDkim3:
    Value: !Sub "${InboxIdentity.DkimDNSTokenName3} CNAME ${InboxIdentity.DkimDNSTokenValue3}"
