AWSTemplateFormatVersion: '2010-09-09'
Description: >
  The xChange app (apps/web) on app.xchangeinvoice.com: the static export in a
  private S3 bucket behind CloudFront, built with an empty base path. Replaces
  the copy on Strato's webspace under greenitsolutions.net/xchange/.

  Deployed by .github/workflows/deploy-ui.yml as the stack xchange-app. The DNS
  record lives in domain.yml, which points app.xchangeinvoice.com here.

Parameters:
  DomainName:
    Type: String
    Default: app.xchangeinvoice.com
  CertificateArn:
    Type: String
    Description: The us-east-1 certificate from certificate.yml.

Resources:
  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub xchange-app-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: xchange

  AppOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: xchange-app
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AppBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${AppBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${AppDistribution}

  # What apps/web/public/.htaccess does on Apache: the directory index, and
  # every review URL onto the one pre-rendered placeholder - invoice ids are
  # created at runtime and the page reads the real id from the address.
  AppRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: xchange-app-request
      AutoPublish: true
      FunctionConfig:
        Comment: Directory index and review rewrite for the xChange app
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (/^\/invoices\/[^\/]+\/review\/?$/.test(uri)) {
            request.uri = '/invoices/demo/review/index.html';
            return request;
          }
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.lastIndexOf('.') < uri.lastIndexOf('/')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  # The app is never for search engines, at launch or after.
  AppHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: xchange-app-headers
        Comment: Security headers; never indexed
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: X-Robots-Tag
              Value: noindex, nofollow
              Override: true

  AppDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: xChange app
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: app
            DomainName: !GetAtt AppBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt AppOriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # AWS managed policy "CachingOptimized"; HTML is uploaded no-cache.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref AppHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt AppRequestFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
      Tags:
        - Key: Project
          Value: xchange

Outputs:
  BucketName:
    Value: !Ref AppBucket
  DistributionId:
    Value: !Ref AppDistribution
  DistributionDomain:
    Description: Where domain.yml points app.xchangeinvoice.com.
    Value: !GetAtt AppDistribution.DomainName
