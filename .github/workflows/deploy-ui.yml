name: Deploy xChange UI

# xChange's own deploy street. It shares no configuration with the
# greenitsolutions repo: its own GitHub environment, its own secrets, its own
# target directory. Nothing here can affect the main site or Bookkeeping.
#
# Targets:
#   https://app.xchangeinvoice.com/        S3 + CloudFront (job deploy-aws, infra/aws/app.yml)
#   https://greenitsolutions.net/xchange/  Strato webspace (job deploy), until it becomes a redirect
#
# Strato: the home directory on that host is the web root (in the greenitsolutions repo,
# deploy.yml uploads greenitsolutions.net/* to ~/ with strip_components: 1), so
# /xchange/ is ~/xchange.
#
# Transfer is a single archive, not per-file SFTP. The Bookkeeping workflow in
# that repo documents why: per-file transfers left public/ half-synced and broke
# the app.
#
# Adding a staging lane later is a copy of this file with BASE_PATH=/DEV/xchange
# and DEPLOY_DIR=DEV/xchange — the site's .htaccess already flags /DEV/ as
# IS_STAGING and forces no-store there.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'infra/aws/app.yml'
      - '.github/workflows/deploy-ui.yml'
  workflow_dispatch:

# Never let two deploys interleave on the server.
concurrency:
  group: deploy-xchange-ui
  cancel-in-progress: false

env:
  # Directory under the web root, and the URL prefix baked into the build.
  # These two must agree or the assets 404.
  DEPLOY_DIR: xchange
  BASE_PATH: /xchange
  # Canonical origin. The host 301-redirects www -> non-www, so the smoke test
  # asks for the canonical name directly (and follows redirects regardless).
  SITE_ORIGIN: https://greenitsolutions.net

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: xchange-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      # Exact decimal arithmetic and the totals port, on the same examples as
      # the server's calculator.
      - name: Test
        working-directory: apps/web
        run: npm test

      - name: Build static export
        working-directory: apps/web
        env:
          XCHANGE_BASE_PATH: ${{ env.BASE_PATH }}
          # Baked in at build time, because a static export has no server to read
          # configuration at runtime. Set the XCHANGE_API_URL repository variable
          # to the App Runner URL; leaving it unset keeps the UI on mock data.
          NEXT_PUBLIC_XCHANGE_API_URL: ${{ vars.XCHANGE_API_URL }}
        run: npm run build

      - name: Verify the export before shipping it
        working-directory: apps/web
        run: |
          set -e

          test -d out || { echo "No out/ directory — is output:'export' still set?"; exit 1; }
          test -f out/upload/index.html || { echo "Missing /upload page."; exit 1; }
          test -f out/invoices/demo/review/index.html || { echo "Missing review page."; exit 1; }
          test -f out/.htaccess || { echo "Missing .htaccess — Apache rewrites would be lost."; exit 1; }

          # A basePath regression would produce root-relative asset URLs and a
          # blank page in production, so fail loudly here instead.
          if ! grep -q "${BASE_PATH}/_next/" out/upload/index.html; then
            echo "Assets are not prefixed with ${BASE_PATH} — check basePath in next.config.ts."
            exit 1
          fi

          echo "Export verified. Pages:"
          find out -name 'index.html' | sort

      - name: Package as a single archive
        working-directory: apps/web
        run: |
          # `-C out .` includes dotfiles, so .htaccess travels with the build.
          tar czf ../../xchange-ui.tar.gz -C out .
          echo "Archive size: $(du -h ../../xchange-ui.tar.gz | cut -f1)"

      - name: Upload archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.XCHANGE_SFTP_HOST }}
          username: ${{ secrets.XCHANGE_SFTP_USERNAME }}
          password: ${{ secrets.XCHANGE_SFTP_PASSWORD }}
          source: "xchange-ui.tar.gz"
          target: "~/"
          overwrite: true

      - name: Extract and publish
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.XCHANGE_SFTP_HOST }}
          username: ${{ secrets.XCHANGE_SFTP_USERNAME }}
          password: ${{ secrets.XCHANGE_SFTP_PASSWORD }}
          envs: DEPLOY_DIR
          script: |
            set -e
            cd ~

            # Guard: this workflow may only ever write its own directory.
            case "$DEPLOY_DIR" in
              ""|/*|*..*) echo "Refusing to deploy to '$DEPLOY_DIR'."; exit 1 ;;
            esac

            # Unpack into a staging directory, then swap. A static export is
            # entirely build output with no server-side state to preserve, and a
            # fresh directory stops old _next chunks accumulating forever.
            rm -rf "$DEPLOY_DIR.new"
            mkdir -p "$DEPLOY_DIR.new"
            tar xzf ~/xchange-ui.tar.gz -C "$DEPLOY_DIR.new"

            # Refuse to publish an archive that arrived incomplete.
            test -f "$DEPLOY_DIR.new/upload/index.html" || { echo "Upload page missing after extract — aborting, live site untouched."; exit 1; }
            test -f "$DEPLOY_DIR.new/.htaccess"          || { echo ".htaccess missing after extract — aborting, live site untouched."; exit 1; }

            # Swap last, so any failure above leaves the live site as it was.
            rm -rf "$DEPLOY_DIR.old"
            if [ -d "$DEPLOY_DIR" ]; then mv "$DEPLOY_DIR" "$DEPLOY_DIR.old"; fi
            mkdir -p "$(dirname "$DEPLOY_DIR")"
            mv "$DEPLOY_DIR.new" "$DEPLOY_DIR"
            rm -rf "$DEPLOY_DIR.old"
            rm -f ~/xchange-ui.tar.gz

            # ── The database is never touched by this workflow. ──
            # This deploys static frontend files only.

            echo "Published to ~/$DEPLOY_DIR"
            ls -la "$DEPLOY_DIR" | head -20

      - name: Smoke-test the live site
        run: |
          set -e

          check() {
            local path="$1" expect="$2"
            local url="${SITE_ORIGIN}${BASE_PATH}${path}"
            # -L matters: the host canonicalises www -> non-www with a 301, and
            # an unfollowed redirect looks identical to a broken deploy.
            local code
            code=$(curl -sSL -o /tmp/page.html -w '%{http_code}' --max-time 30 "$url" || echo 000)
            echo "HTTP $code  $url"
            [ "$code" = "200" ] || { echo "Expected 200."; return 1; }
            if [ -n "$expect" ]; then
              grep -q "$expect" /tmp/page.html || { echo "Page did not contain: $expect"; return 1; }
            fi
          }

          check "/upload/" "${BASE_PATH}/_next/"

          # An arbitrary invoice id must be served by the .htaccess rewrite; if
          # mod_rewrite is off for this directory, deep links 404 while the rest
          # of the site looks perfectly fine.
          check "/invoices/smoke-test-id/review/" "Factuur beoordelen"

          echo "Live site OK."

  # The same app on its own domain: built without a base path, published to
  # S3 behind CloudFront (stack xchange-app, infra/aws/app.yml). Runs beside the
  # Strato copy above until greenitsolutions.net/xchange becomes a redirect.
  deploy-aws:
    name: Build and publish (app.xchangeinvoice.com)
    runs-on: ubuntu-latest
    environment: xchange-aws
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-central-1
      APP_STACK: xchange-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Test
        working-directory: apps/web
        run: npm test

      - name: Build static export
        working-directory: apps/web
        env:
          XCHANGE_BASE_PATH: ""
          NEXT_PUBLIC_XCHANGE_API_URL: ${{ vars.XCHANGE_API_URL }}
        run: npm run build

      - name: Verify the export before shipping it
        working-directory: apps/web
        run: |
          set -e
          test -f out/upload/index.html || { echo "Missing /upload page."; exit 1; }
          test -f out/invoices/demo/review/index.html || { echo "Missing review page."; exit 1; }
          # At the root of its own domain the assets are "/_next/...", never "/xchange/_next/...".
          grep -q '"/_next/' out/upload/index.html || { echo "Assets are not at the root."; exit 1; }
          ! grep -q '/xchange/_next/' out/upload/index.html || { echo "Assets still carry /xchange."; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The certificate (infra/aws/certificate.yml) is created by hand once the
      # domain's DNS is on Route 53. Until it exists there is nothing to publish to.
      - name: Find the certificate
        id: cert
        run: |
          ARN=$(aws cloudformation describe-stacks --region us-east-1 --stack-name xchange-certificate \
            --query "Stacks[0].Outputs[?OutputKey=='CertificateArn'].OutputValue" --output text 2>/dev/null || true)
          if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
            echo "No certificate yet - app.xchangeinvoice.com is not published." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "arn=" >> "$GITHUB_OUTPUT"
          else
            echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the app stack
        id: stack
        if: steps.cert.outputs.arn != ''
        run: |
          set -e
          aws cloudformation deploy \
            --stack-name "$APP_STACK" \
            --template-file infra/aws/app.yml \
            --no-fail-on-empty-changeset \
            --parameter-overrides CertificateArn="${{ steps.cert.outputs.arn }}"
          out() { aws cloudformation describe-stacks --stack-name "$APP_STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "bucket=$(out BucketName)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(out DistributionId)" >> "$GITHUB_OUTPUT"
          echo "domain=$(out DistributionDomain)" >> "$GITHUB_OUTPUT"

      - name: Upload the app
        if: steps.cert.outputs.arn != ''
        working-directory: apps/web
        run: |
          set -e
          BUCKET="${{ steps.stack.outputs.bucket }}"
          # Hashed assets forever, everything else revalidated, then remove what is gone.
          # .htaccess is Apache's; CloudFront does the same in its request function.
          aws s3 sync out/_next "s3://$BUCKET/_next" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync out "s3://$BUCKET" --exclude "_next/*" --exclude ".htaccess" --cache-control "no-cache" --delete
          aws cloudfront create-invalidation --distribution-id "${{ steps.stack.outputs.distribution }}" --paths "/*" --query Invalidation.Id --output text

      - name: Smoke-test the app
        if: steps.cert.outputs.arn != ''
        run: |
          set -e
          # The distribution's own name works before and after DNS points app.xchangeinvoice.com at it.
          BASE="https://${{ steps.stack.outputs.domain }}"
          check() {
            local code
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /tmp/page.html -D /tmp/headers.txt -w '%{http_code}' --max-time 30 "$BASE$1" || echo 000)
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "HTTP $code  $BASE$1"
            [ "$code" = "200" ] || { echo "Expected 200."; return 1; }
            grep -q "$2" /tmp/page.html || { echo "Page did not contain: $2"; return 1; }
            grep -qi '^x-robots-tag: noindex' /tmp/headers.txt || { echo "Missing X-Robots-Tag noindex"; return 1; }
          }
          check "/upload/" '"/_next/'
          # Any invoice id lands on the review placeholder, as on Apache.
          check "/invoices/smoke-test-id/review/" "Factuur beoordelen"
          echo "### xChange app: https://app.xchangeinvoice.com/ (distribution $BASE)" >> "$GITHUB_STEP_SUMMARY"
