name: Deploy xChange API

# Publishes the ASP.NET Core API as a Lambda zip and deploys it behind a
# Function URL.
#
# Free at this stage, which is why it is shaped this way: Lambda's 1M requests
# and 400,000 GB-seconds a month are a perpetual free tier, a Function URL costs
# nothing and terminates TLS itself, and nothing runs between uploads.
#
# App Runner was the original target, but AWS closed it to new customers on
# 30 April 2026, so this account can never subscribe. Fargate behind an ALB
# would work and would keep 20 MB uploads, but bills ~$25-35/month whether or
# not anyone uses it.
#
# The trade-off is request size: a Function URL rejects anything over 6 MB, and
# a binary body is base64-encoded first, so ~4.4 MB of PDF gets through. The API
# refuses larger files with a clear message.
#
# No Docker: a zip against the managed dotnet8 runtime builds faster and has
# nothing to store in ECR.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'infra/aws/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-xchange-api
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: eu-central-1
  BOOTSTRAP_STACK: xchange-bootstrap
  SERVICE_STACK: xchange-service
  SECRET_NAME: xchange/anthropic-api-key

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: xchange-aws

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Gate the deploy on the tests, not just on the build.
      - name: Test
        run: dotnet test --nologo

      - name: Publish and package
        id: package
        run: |
          set -e
          dotnet publish src/InvoicePlatform.Api/InvoicePlatform.Api.csproj \
            -c Release -o publish --no-self-contained

          # Lambda wants the assemblies at the root of the zip, not inside a
          # folder, so zip from within the publish directory.
          (cd publish && zip -qr ../xchange-api.zip .)

          echo "key=xchange-api/${GITHUB_SHA}.zip" >> "$GITHUB_OUTPUT"
          echo "Package size: $(du -h xchange-api.zip | cut -f1)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read the bootstrap stack
        id: bootstrap
        run: |
          set -e

          if ! aws cloudformation describe-stacks --stack-name "$BOOTSTRAP_STACK" >/dev/null 2>&1; then
            echo "::error::Bootstrap stack '$BOOTSTRAP_STACK' not found."
            echo "Deploy it once with:"
            echo "  aws cloudformation deploy --template-file infra/aws/bootstrap.yml \\"
            echo "    --stack-name $BOOTSTRAP_STACK --capabilities CAPABILITY_NAMED_IAM"
            exit 1
          fi

          BUCKET=$(aws cloudformation describe-stacks --stack-name "$BOOTSTRAP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactBucketName'].OutputValue" --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Ensure the Anthropic secret exists
        id: secret
        run: |
          set -e

          # Created with a placeholder on first run so the stack has something to
          # reference. The real value is set once, by a human, outside CI - this
          # workflow can create the secret and read its metadata, but not its
          # value.
          if ! aws secretsmanager describe-secret --secret-id "$SECRET_NAME" >/dev/null 2>&1; then
            aws secretsmanager create-secret \
              --name "$SECRET_NAME" \
              --description "Anthropic API key for the xChange API. Set the value manually." \
              --secret-string "PLACEHOLDER-set-me" >/dev/null
            echo "::warning::Created $SECRET_NAME with a placeholder. Extraction will fail until you set the real key:"
            echo "::warning::aws secretsmanager put-secret-value --secret-id $SECRET_NAME --secret-string '<key>'"
          fi

          ARN=$(aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --query ARN --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Upload the package
        run: |
          set -e
          aws s3 cp xchange-api.zip \
            "s3://${{ steps.bootstrap.outputs.bucket }}/${{ steps.package.outputs.key }}"

      - name: Deploy the service stack
        id: service
        run: |
          set -e

          # A stack whose first create failed sits in ROLLBACK_COMPLETE, which
          # cannot be updated - only replaced. Without this, every retry after a
          # first-time failure dies with a confusing "stack is in
          # ROLLBACK_COMPLETE state and can not be updated" instead of the
          # original error.
          STATUS=$(aws cloudformation describe-stacks --stack-name "$SERVICE_STACK" \
                    --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Stack is in ROLLBACK_COMPLETE from a failed first create; deleting it."
            aws cloudformation delete-stack --stack-name "$SERVICE_STACK"
            aws cloudformation wait stack-delete-complete --stack-name "$SERVICE_STACK"
          fi

          aws cloudformation deploy \
            --template-file infra/aws/service.yml \
            --stack-name "$SERVICE_STACK" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ArtifactBucket="${{ steps.bootstrap.outputs.bucket }}" \
              ArtifactKey="${{ steps.package.outputs.key }}" \
              AnthropicSecretArn="${{ steps.secret.outputs.arn }}"

          URL=$(aws cloudformation describe-stacks --stack-name "$SERVICE_STACK" \
                  --query "Stacks[0].Outputs[?OutputKey=='ServiceUrl'].OutputValue" --output text)
          # Function URLs come back with a trailing slash; strip it so paths join cleanly.
          URL="${URL%/}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "API_URL=$URL" >> "$GITHUB_ENV"

      - name: Allow anonymous invoke through the function URL
        run: |
          set -e
          # The companion to UrlPermission in the template. It carries the
          # InvokedViaFunctionUrl condition, which CloudFormation cannot express,
          # so it is applied here. Idempotent: an existing statement is a
          # conflict, not a failure.
          if aws lambda add-permission \
               --function-name xchange-api \
               --statement-id UrlPolicyInvokeFunction \
               --action lambda:InvokeFunction \
               --principal '*' \
               --invoked-via-function-url >/dev/null 2>&1
          then
            echo "Permission added."
          else
            echo "Permission already present."
          fi

      - name: Show the stack failure reason
        if: failure() && steps.service.outcome == 'failure'
        run: |
          # CloudFormation's own error is usually one line in the event log;
          # surfacing it here saves a trip to the console.
          aws cloudformation describe-stack-events --stack-name "$SERVICE_STACK" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED'].[LogicalResourceId,ResourceStatusReason]" \
            --output table | head -40 || true

      - name: Smoke-test the deployed API
        run: |
          set -e
          echo "Checking $API_URL/health"

          # The first request pays the cold start, which for ASP.NET Core on
          # Lambda can take a few seconds - so retry rather than failing on it.
          for attempt in $(seq 1 10); do
            code=$(curl -sSL -o /tmp/health.txt -w '%{http_code}' --max-time 30 "$API_URL/health" || echo 000)
            echo "  attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && { echo "API is healthy."; break; }
            [ "$attempt" = "10" ] && { echo "Never became healthy."; cat /tmp/health.txt; exit 1; }
            sleep 10
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### xChange API"
            echo
            echo "- URL: ${API_URL:-not deployed}"
            echo "- Package: ${{ steps.package.outputs.key }}"
            echo
            echo "Set the repository variable \`XCHANGE_API_URL\` to the URL above,"
            echo "then re-run **Deploy xChange UI** so the frontend calls it."
          } >> "$GITHUB_STEP_SUMMARY"
