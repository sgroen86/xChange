name: Deploy xChange API

# Builds the ASP.NET Core API as a container, pushes it to ECR and reconciles
# the App Runner service through CloudFormation.
#
# Everything except the bootstrap stack is created by this workflow, including
# the ECR repository, the secret placeholder and the service itself - so a fresh
# account needs one manual command (infra/aws/bootstrap.yml) and one manual
# secret value, and nothing else.
#
# Why App Runner and not Lambda: the endpoint accepts uploads up to 20 MB and a
# request can run for minutes while the model reads the PDF. API Gateway caps a
# payload at 10 MB and a Lambda function URL at 6 MB, so both would reject valid
# invoices.
#
# The Anthropic key is never seen here. CI may create the secret and read its
# metadata, but not its value; App Runner injects it into the container at
# runtime.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'infra/aws/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-xchange-api
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: xchange-api
  BOOTSTRAP_STACK: xchange-bootstrap
  SERVICE_STACK: xchange-service
  SECRET_NAME: xchange/anthropic-api-key

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: xchange-aws

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Gate the deploy on the tests, not just on the image building.
      - name: Test
        run: dotnet test --nologo

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read the bootstrap stack
        id: bootstrap
        run: |
          set -e

          if ! aws cloudformation describe-stacks --stack-name "$BOOTSTRAP_STACK" >/dev/null 2>&1; then
            echo "::error::Bootstrap stack '$BOOTSTRAP_STACK' not found."
            echo "Deploy it once with:"
            echo "  aws cloudformation deploy --template-file infra/aws/bootstrap.yml \\"
            echo "    --stack-name $BOOTSTRAP_STACK --capabilities CAPABILITY_NAMED_IAM"
            exit 1
          fi

          get() {
            aws cloudformation describe-stacks --stack-name "$BOOTSTRAP_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }

          {
            echo "ecr_access_role=$(get AppRunnerEcrAccessRoleArn)"
            echo "instance_role=$(get AppRunnerInstanceRoleArn)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure the ECR repository exists
        run: |
          set -e
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository \
                 --repository-name "$ECR_REPOSITORY" \
                 --image-scanning-configuration scanOnPush=true >/dev/null
          echo "Repository ready: $ECR_REPOSITORY"

      - name: Ensure the Anthropic secret exists
        id: secret
        run: |
          set -e

          # Created empty on first run so the stack has something to reference.
          # The real value is set once, by a human, outside CI - this workflow
          # has no permission to read or overwrite it.
          if ! aws secretsmanager describe-secret --secret-id "$SECRET_NAME" >/dev/null 2>&1; then
            aws secretsmanager create-secret \
              --name "$SECRET_NAME" \
              --description "Anthropic API key for the xChange API. Set the value manually." \
              --secret-string "PLACEHOLDER-set-me" >/dev/null
            echo "::warning::Created $SECRET_NAME with a placeholder. Extraction will fail until you set the real key:"
            echo "::warning::aws secretsmanager put-secret-value --secret-id $SECRET_NAME --secret-string '<key>'"
          fi

          ARN=$(aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --query ARN --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -e
          # Tagged with the commit sha, so a rollback is a redeploy of an earlier
          # tag; "latest" is a convenience pointer, never the source of truth.
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker build -t "$IMAGE" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy the service stack
        id: service
        run: |
          set -e

          aws cloudformation deploy \
            --template-file infra/aws/service.yml \
            --stack-name "$SERVICE_STACK" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ImageUri="${{ steps.image.outputs.uri }}" \
              EcrAccessRoleArn="${{ steps.bootstrap.outputs.ecr_access_role }}" \
              InstanceRoleArn="${{ steps.bootstrap.outputs.instance_role }}" \
              AnthropicSecretArn="${{ steps.secret.outputs.arn }}"

          URL=$(aws cloudformation describe-stacks --stack-name "$SERVICE_STACK" \
                  --query "Stacks[0].Outputs[?OutputKey=='ServiceUrl'].OutputValue" --output text)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "API_URL=$URL" >> "$GITHUB_ENV"

      - name: Show the stack failure reason
        if: failure() && steps.service.outcome == 'failure'
        run: |
          # CloudFormation's own error is usually one line in the event log;
          # surfacing it here saves a trip to the console.
          aws cloudformation describe-stack-events --stack-name "$SERVICE_STACK" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED'].[LogicalResourceId,ResourceStatusReason]" \
            --output table | head -40 || true

      - name: Smoke-test the deployed API
        run: |
          set -e
          echo "Checking $API_URL/health"

          # App Runner can still be swapping instances immediately after the
          # stack settles, so allow a short warm-up rather than failing on the
          # first request.
          for attempt in $(seq 1 20); do
            code=$(curl -sSL -o /tmp/health.txt -w '%{http_code}' --max-time 20 "$API_URL/health" || echo 000)
            echo "  attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && { echo "API is healthy."; break; }
            [ "$attempt" = "20" ] && { echo "Never became healthy."; cat /tmp/health.txt; exit 1; }
            sleep 15
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### xChange API"
            echo
            echo "- URL: ${API_URL:-not deployed}"
            echo "- Image: ${{ steps.image.outputs.uri }}"
            echo
            echo "Set the repository variable \`XCHANGE_API_URL\` to the URL above,"
            echo "then re-run **Deploy xChange UI** so the frontend calls it."
          } >> "$GITHUB_STEP_SUMMARY"
